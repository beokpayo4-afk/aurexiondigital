services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurexion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurexion}
      POSTGRES_DB: ${POSTGRES_DB:-aurexion}
    ports:
      - "5432:5432"
    volumes:
      - aurexion_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurexion} -d ${POSTGRES_DB:-aurexion}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aurexion:aurexion@db:5432/aurexion}
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-this-jwt-secret-value}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
      PAYMENT_KEY_ID: ${PAYMENT_KEY_ID:-}
      PAYMENT_KEY_SECRET: ${PAYMENT_KEY_SECRET:-}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-INR}
      DOWNLOAD_STORAGE_DIR: ${DOWNLOAD_STORAGE_DIR:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  aurexion_pg:
